<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Mon tableau</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#faf7f2;color:#14213D;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{position:relative;height:100vh;display:flex;flex-direction:column;overflow:hidden;background:#faf7f2}
header{padding:26px 32px 6px}
h1{margin:0;font-size:38px;letter-spacing:-.5px;font-weight:700}
.sub{margin:6px 0 14px;font-size:18px;opacity:.8}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.legend .hint{font-size:13px;opacity:.55;margin-right:4px}
.chip{border:2px solid transparent;border-radius:999px;padding:6px 16px;font:600 13px inherit;font-family:inherit;color:#14213D;cursor:pointer}
.chip.on{border-color:#14213D}
#status{font-size:13px;opacity:.65;min-height:18px;margin-top:8px}
#scroller{flex:1;overflow:auto;padding:10px 32px 48px}
#board{position:relative;width:1552px;height:660px}
.frame{position:absolute;top:0;width:364px;height:600px;border-radius:24px;background:#f0eeea;border:1px solid #e7e3db}
.frame .fh{position:absolute;left:24px;right:20px;top:14px;display:flex;align-items:center;justify-content:space-between}
.frame .ft{font-size:22px;font-weight:700}
.add{width:30px;height:30px;border-radius:50%;border:none;background:#14213D;color:#fff;font-size:20px;line-height:1;cursor:pointer}
.add:hover{opacity:.85}
.postit,.ovp,.zoom .ghost{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.22}
.postit,.ovp{border-radius:2px 2px 26px 2px/2px 2px 16px 2px;background-image:linear-gradient(180deg,rgba(255,255,255,.38) 0,rgba(255,255,255,0) 22%),linear-gradient(160deg,rgba(0,0,0,0) 68%,rgba(0,0,0,.09) 100%);box-shadow:0 1px 1px rgba(0,0,0,.14),0 12px 14px -8px rgba(0,0,0,.35),3px 5px 9px rgba(20,33,61,.08)}
.postit{position:absolute;width:150px;height:150px;padding:16px 14px 22px;cursor:zoom-in;user-select:none;touch-action:none;transform:rotate(var(--rot,0deg));transition:transform .15s,box-shadow .15s}
.postit:hover{transform:rotate(0deg) translateY(-3px)}
.postit::after{content:'';position:absolute;inset:-8px;z-index:-1}
.postit,.postit *{cursor:pointer!important}
.postit.drag,.postit.drag *{cursor:grabbing!important}
.postit.editing .txt{cursor:text!important}
.ovp,.ovp *{cursor:pointer!important}
.postit.drag{cursor:grabbing;z-index:60;transition:none;transform:rotate(0deg) scale(1.04);box-shadow:0 18px 30px rgba(20,33,61,.3)}
.postit .txt{white-space:pre-wrap;overflow:hidden;max-height:100%;word-break:break-word;outline:none}
.postit.editing{cursor:text;user-select:text;z-index:55}
.postit.editing .txt{overflow:auto}
.postit .badge{position:absolute;right:12px;bottom:7px;font-size:12px;opacity:.55;pointer-events:none}
.tools{position:absolute;top:5px;right:5px;display:flex;gap:3px;opacity:0;transition:opacity .12s}
.postit:hover .tools{opacity:1}
@media (hover:none){.tools{opacity:1}}
.tools button{width:22px;height:22px;border:none;border-radius:50%;background:rgba(255,255,255,.75);color:#14213D;font-size:12px;line-height:1;cursor:pointer;padding:0}
.tools button:hover{background:#fff}
.postit.arch{filter:saturate(.5);opacity:.85}
.postit.arch::before{content:'ARCHIVÉ';position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) rotate(-14deg);border:3px solid #c0392b;border-radius:6px;color:#c0392b;font:800 19px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:2px;padding:5px 9px;opacity:.85;pointer-events:none;z-index:2;white-space:nowrap}
.tools .arm,.tools .arm:hover{background:#c0392b;color:#fff;width:auto;padding:0 8px}
.zoom{position:absolute;overflow:hidden;z-index:20;transition:left .45s cubic-bezier(.2,.8,.2,1),top .45s cubic-bezier(.2,.8,.2,1),width .45s cubic-bezier(.2,.8,.2,1),height .45s cubic-bezier(.2,.8,.2,1),background .45s,border-radius .45s,opacity .3s}
.zoom .ghost{position:absolute;left:0;top:0;width:150px;padding:16px 14px;white-space:pre-wrap;opacity:1;transition:opacity .25s;pointer-events:none}
.zoom.go .ghost{opacity:0}
.zin{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transition:opacity .28s}
.zoom.in .zin{opacity:1}
.zbar{padding:20px 32px 0;display:flex;align-items:center;gap:12px}
.back{border:none;background:#14213D;color:#fff;border-radius:999px;padding:9px 18px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.back:hover{opacity:.88}
.ztitle{margin:18px 32px 4px;font-size:30px;letter-spacing:-.3px;line-height:1.2;max-width:900px;white-space:pre-wrap}
.zrow{padding:8px 32px 6px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.addbtn{border:2px dashed rgba(20,33,61,.45);background:transparent;color:#14213D;border-radius:999px;padding:6px 16px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.addbtn:hover{background:rgba(255,255,255,.6)}
.zcanvas{position:relative;flex:1;overflow:hidden;margin:6px 8px 0;touch-action:none}
.zcanvas.panning,.zcanvas.panning *{cursor:grabbing!important}
.empty{position:absolute;left:24px;top:24px;font-size:15px;opacity:.55;max-width:420px;pointer-events:none}

.fb{display:flex;gap:6px;align-items:center}
.fdel{width:30px;height:30px;border-radius:50%;border:none;background:rgba(20,33,61,.08);color:#14213D;cursor:pointer;opacity:0;transition:opacity .12s;font-size:16px;line-height:1;padding:0}
.frame:hover .fdel{opacity:1}
.fdel.arm,.fdel.arm:hover{opacity:1;background:#c0392b;color:#fff;width:auto;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600}
.frame .ft{cursor:pointer}.frame .ft:hover{text-decoration:underline}
.tabs{padding:8px 32px 0;display:flex;gap:6px}
.tab{border:none;background:transparent;color:#14213D;font-family:inherit;font-weight:600;font-size:14px;padding:8px 16px;border-radius:999px;cursor:pointer;opacity:.6}
.tab.on{background:#14213D;color:#fff;opacity:1}
.pane{display:none;flex:1;flex-direction:column;min-height:0}
.pane.on{display:flex}
.mwrap{flex:1;overflow:auto;padding:12px 32px 40px;max-width:940px}
.mempty{font-size:15px;opacity:.55;margin:14px 0}
.meet{background:#fff;border-radius:18px;padding:14px 16px 8px;margin:14px 0;box-shadow:0 1px 2px rgba(20,33,61,.1)}
.meet .mh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.meet input[type=date]{font-family:inherit;font-weight:600;font-size:15px;border:1px solid #e1ddd3;border-radius:10px;padding:5px 10px;color:#14213D;background:#faf7f2}
.meet textarea{display:block;width:100%;min-height:120px;resize:none;border:none;outline:none;font-family:inherit;font-size:15px;line-height:1.5;color:#14213D;background:transparent;overflow:hidden}
.msynb{border:none;background:#14213D;color:#fff;border-radius:999px;padding:0 12px;height:26px;cursor:pointer;font:600 13px inherit;font-family:inherit;margin-left:auto;margin-right:8px}
.msynb.wait{background:#e1ddd3;color:#14213D}
.msyn{margin:6px 0 10px;border-top:1px dashed #d9d4c9;padding-top:10px}
.msyn h4{margin:0 0 6px;font-size:13px;opacity:.65;display:flex;justify-content:space-between;align-items:center}
.msyn textarea{background:#faf7f2;border-radius:12px;padding:10px 12px;font-size:14.5px}
.msyn button{border:1px solid #d9d4c9;background:#fff;color:#14213D;border-radius:999px;padding:3px 12px;font:600 12px inherit;font-family:inherit;cursor:pointer;margin-left:6px}
.mdel{border:none;background:#f0eeea;color:#14213D;border-radius:999px;min-width:26px;height:26px;cursor:pointer;font-size:14px}
.mdel.arm{background:#c0392b;color:#fff;padding:0 10px}
.ovl{display:flex;flex-wrap:wrap;gap:16px;padding:16px 32px;overflow:auto;align-content:flex-start}
.ovp{width:150px;height:150px;padding:16px 14px;color:#14213D;cursor:zoom-in;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.ovp:hover{transform:translateY(-2px)}

h1[contenteditable=true]{outline:2px dashed rgba(20,33,61,.35);outline-offset:4px;border-radius:6px}
h1{cursor:text}
.topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.tbtn{border:1px solid #d9d4c9;background:#fff;color:#14213D;border-radius:999px;padding:6px 14px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.tbtn:hover{background-color:#f0eeea}
select.tbtn{-webkit-appearance:none;appearance:none;padding-right:32px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%2314213D' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 13px center;background-size:10px 6px}
html[data-theme=dark] select.tbtn{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23eceff6' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 13px center;background-size:10px 6px}
.zctl{display:inline-flex;align-items:center;gap:2px;border:1px solid #d9d4c9;background:#fff;border-radius:999px;padding:2px}
.zctl button{border:none;background:transparent;color:#14213D;width:28px;height:26px;border-radius:999px;font-size:16px;cursor:pointer}
.zctl button:hover{background:#f0eeea}
.zctl span{font-size:12px;min-width:38px;text-align:center;opacity:.7}
.addframe{position:absolute;top:0;width:364px;height:90px;border:2px dashed #cfc9bc;border-radius:24px;display:flex;align-items:center;justify-content:center;font-weight:600;color:#14213D;opacity:.6;cursor:pointer}
.addframe:hover{opacity:1;background:rgba(255,255,255,.5)}
.trashp{position:absolute;inset:0;z-index:200;background:#faf7f2;display:flex;flex-direction:column}
.trashp .th{padding:20px 32px 6px;display:flex;align-items:center;gap:14px}
.trashp h2{margin:0;font-size:26px}
.trashp .tl{flex:1;overflow:auto;padding:8px 32px 40px;max-width:900px}
.trow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px 16px;margin:10px 0;box-shadow:0 1px 2px rgba(20,33,61,.1)}
.trow .tt{flex:1;white-space:pre-wrap;word-break:break-word;font-size:15px}
.trow .tt small{display:block;opacity:.55;font-size:12px;margin-top:2px}
.trow button{border:none;border-radius:999px;padding:7px 14px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer}
.trow .rs{background:#14213D;color:#fff}
.trow .dl{background:#f0eeea;color:#14213D}
.trow .dl.arm{background:#c0392b;color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14213D;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* ---------- mode sombre ---------- */
.postit,.ovp,.postit .tools button{color:#14213D}
html[data-theme=dark]{color-scheme:dark}
html[data-theme=dark] body,html[data-theme=dark] #app,html[data-theme=dark] .trashp{background:#141a2a;color:#eceff6}
html[data-theme=dark] .frame{background:#1d2538;border-color:#2b3550}
html[data-theme=dark] .tbtn,html[data-theme=dark] .zctl{background-color:#1d2538;color:#eceff6;border-color:#33405c}
html[data-theme=dark] .tbtn:hover,html[data-theme=dark] .zctl button:hover{background-color:#27324b}
html[data-theme=dark] .zctl button{color:#eceff6}
html[data-theme=dark] .chip.on{border-color:#eceff6}
html[data-theme=dark] .back,html[data-theme=dark] .msynb,html[data-theme=dark] .trow .rs,html[data-theme=dark] .tab.on{background:#eceff6;color:#14213D}
html[data-theme=dark] .msynb.wait{background:#33405c;color:#eceff6}
html[data-theme=dark] .zoom{background:#141a2a!important}
html[data-theme=dark] .zoom .ghost{color:#14213D}
html[data-theme=dark] .addbtn{color:#eceff6;border-color:rgba(236,239,246,.5)}
html[data-theme=dark] .addbtn:hover{background:rgba(255,255,255,.08)}
html[data-theme=dark] .meet,html[data-theme=dark] .trow{background:#1d2538;box-shadow:0 1px 2px rgba(0,0,0,.4)}
html[data-theme=dark] .meet input[type=date]{background:#141a2a;color:#eceff6;border-color:#33405c}
html[data-theme=dark] .meet textarea,html[data-theme=dark] .msyn textarea{color:#eceff6}
html[data-theme=dark] .msyn textarea{background:#141a2a}
html[data-theme=dark] .msyn{border-top-color:#33405c}
html[data-theme=dark] .mdel,html[data-theme=dark] .trow .dl,html[data-theme=dark] .msyn button{background:#27324b;color:#eceff6;border-color:#33405c}
html[data-theme=dark] .mdel.arm,html[data-theme=dark] .trow .dl.arm{background:#c0392b;color:#fff}
html[data-theme=dark] .addframe{border-color:#3b4768;color:#eceff6}
html[data-theme=dark] .addframe:hover{background:rgba(255,255,255,.06)}
html[data-theme=dark] .fdel{background:rgba(255,255,255,.12);color:#eceff6}
html[data-theme=dark] .fdel.arm{background:#c0392b;color:#fff}
html[data-theme=dark] .tab{color:#eceff6}
html[data-theme=dark] h1[contenteditable=true]{outline-color:rgba(236,239,246,.4)}
html[data-theme=dark] .postit.arch::before{background:rgba(20,26,42,.55)}
/* ---------- note simple (sans niveau en dessous) ---------- */
.postit.leaf{height:auto;min-height:84px;width:150px;border-radius:10px;background-image:none;transform:none;box-shadow:0 1px 2px rgba(20,33,61,.25);border:1.5px solid rgba(20,33,61,.18);padding:12px 14px 14px}
.postit.leaf:hover{transform:none}
.postit.leaf .badge{display:none}
.postit.leaf,.postit.leaf *{cursor:text!important}
.postit.drag,.postit.drag *{cursor:grabbing!important}
.thm{position:fixed;top:16px;right:20px;z-index:300;display:flex;align-items:center;gap:6px;font-size:13px;opacity:.85;cursor:pointer;user-select:none}
.thm input{display:none}
.thm .trk{width:38px;height:20px;border-radius:999px;background:#d9d4c9;position:relative;transition:background .2s}
.thm .trk::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .2s}
.thm input:checked+.trk{background:#5b6b95}
.thm input:checked+.trk::after{transform:translateX(18px)}

/* bouton « Supprimer ? » : le texte ne déborde plus */
.tools .arm,.tools .arm:hover{white-space:nowrap;height:22px;line-height:22px;width:auto;min-width:0;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600}
.tools:has(.arm) button:not(.arm){display:none}
.mdel.arm,.trow .dl.arm,.fdel.arm{white-space:nowrap}
.postit .tools .arm,.postit .tools .arm:hover{color:#fff;background:#c0392b}

/* images dans les post-its */
.postit.imgnote{height:auto;width:var(--w,240px);padding:0;background-image:none;background-color:transparent!important;border-radius:3px;box-shadow:none}
.postit.imgnote img{display:block;width:100%;height:auto;border-radius:3px;box-shadow:0 2px 8px rgba(20,33,61,.3);pointer-events:none;-webkit-user-drag:none;user-select:none}
.postit.imgnote .txt,.postit.imgnote .badge,.postit.imgnote .b-ed,.postit.imgnote .b-col{display:none}
.postit:not(.imgnote) .b-size{display:none}
.postit.imgnote::before{display:none}
.postit.imgnote.arch::before{display:block}
.lightbox{position:fixed;inset:0;z-index:9999;background:rgba(10,15,30,.82);display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.lightbox img{max-width:92vw;max-height:92vh;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#fff}
.postit .rz{display:none;position:absolute;right:0;bottom:0;width:20px;height:20px;opacity:0;transition:opacity .15s;background:linear-gradient(135deg,transparent 52%,rgba(20,33,61,.55) 52%,rgba(20,33,61,.55) 60%,transparent 60%,transparent 72%,rgba(20,33,61,.55) 72%,rgba(20,33,61,.55) 80%,transparent 80%);border-bottom-right-radius:inherit}
.zcanvas .postit .rz{display:block}
.postit:hover .rz,.postit.rsz .rz{opacity:1}
.postit .rz,.postit .rz:hover{cursor:nwse-resize!important}
.postit.rsz{transition:none;transform:rotate(0deg)}
.zcanvas.dropping{outline:3px dashed rgba(20,33,61,.5);outline-offset:-6px}

/* collaborateurs */
.peoplep{position:absolute;inset:0;z-index:200;background:#faf7f2;display:flex;flex-direction:column}
.peoplep .th{padding:20px 32px 6px;display:flex;align-items:center;gap:14px}
.peoplep h2{margin:0;font-size:26px}
.peoplep .pl{flex:1;overflow:auto;padding:8px 32px 40px}
.peoplep .padd{display:flex;gap:8px;margin:6px 0 16px;max-width:520px}
.peoplep input[type=text]{flex:1;border:1.5px solid rgba(20,33,61,.25);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;color:#14213D;outline:none}
.peoplep input[type=text]:focus{border-color:#14213D}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start}
.pcard{background:#fff;border-radius:16px;padding:14px 16px 16px;box-shadow:0 1px 2px rgba(20,33,61,.12)}
.pcard h3{margin:0 0 2px;font-size:19px;outline:none;border-radius:6px;padding:1px 4px;margin-left:-4px}
.pcard h3:focus{background:rgba(20,33,61,.07)}
.pcard small{display:block;opacity:.55;font-size:12px;margin-bottom:8px}
.pask{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:14.5px;border-top:1px solid rgba(20,33,61,.08)}
.pask input{margin-top:3px;flex:none}
.pask span{flex:1;word-break:break-word}
.pask.done span{text-decoration:line-through;opacity:.45}
.pask button,.pcard .pdel{border:none;background:transparent;color:inherit;opacity:.5;font:inherit;cursor:pointer;border-radius:8px;padding:0 6px}
.pask button:hover{opacity:1;background:rgba(20,33,61,.08)}
.pcard .pnew{margin-top:8px;width:100%;box-sizing:border-box}
.pcard .plinks{margin-top:10px;font-size:12.5px;opacity:.75}
.pcard .plinks div{padding:2px 0 2px 10px;border-left:3px solid rgba(20,33,61,.18);margin:3px 0;word-break:break-word}
.pcard .pdel{margin-top:10px;font-size:12px;opacity:.55;border:1px solid rgba(20,33,61,.25);padding:4px 10px;border-radius:999px}
.pcard .pdel.arm{background:#c0392b;color:#fff;opacity:1;border-color:#c0392b}
.whos{position:absolute;left:12px;bottom:6px;right:34px;display:flex;flex-wrap:wrap;gap:3px;pointer-events:none}
.whos i{font-style:normal;font-size:11px;font-weight:600;background:rgba(20,33,61,.14);border-radius:999px;padding:1px 7px;white-space:nowrap}
.postit.leaf .whos{position:static;margin-top:8px}
.postit.imgnote .whos{left:6px;bottom:6px}
.postit.imgnote .whos i{background:rgba(255,255,255,.88)}
.whop{position:fixed;z-index:9998;background:#fff;color:#14213D;border-radius:12px;padding:8px 10px;box-shadow:0 8px 30px rgba(20,33,61,.35);min-width:170px;font-size:14px}
.whop label{display:flex;align-items:center;gap:8px;padding:4px 2px;cursor:pointer}
.whop small{opacity:.6;font-size:12px}
html[data-theme=dark] .peoplep{background:#141a2a;color:#eceff6}
html[data-theme=dark] .pcard{background:#1d2538}
html[data-theme=dark] .peoplep input[type=text]{background:#1d2538;color:#eceff6;border-color:rgba(236,239,246,.3)}
html[data-theme=dark] .pcard .pdel{border-color:rgba(236,239,246,.3)}
html[data-theme=dark] .whos i{background:rgba(20,33,61,.18)}
.postit .tools .b-who{font-size:12px}
.mpart{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:2px 0 8px;font-size:13px}
.mpart .ml{opacity:.55}
.mchip{display:inline-flex;align-items:center;gap:2px;background:rgba(20,33,61,.1);border-radius:999px;padding:2px 3px 2px 10px;font-weight:600}
.mchip button,.mpadd{border:none;background:transparent;color:inherit;cursor:pointer;font:inherit}
.mchip button{opacity:.55;font-size:15px;line-height:1;padding:0 5px;border-radius:50%}
.mchip button:hover{opacity:1;background:rgba(20,33,61,.12)}
.mpadd{border:1.5px dashed rgba(20,33,61,.35);border-radius:999px;padding:1px 10px;font-size:12.5px;opacity:.75}
.mpadd:hover{opacity:1}
html[data-theme=dark] .mchip{background:rgba(236,239,246,.14)}
html[data-theme=dark] .mpadd{border-color:rgba(236,239,246,.4)}
.topbar{position:relative}
#menubtn{font-size:18px;line-height:1;padding:7px 14px}

<body>
<label class="thm" title="Mode clair / sombre"><span>☀</span><input type="checkbox" id="themebtn"><span class="trk"></span><span>☾</span></label>
<div id="app">
  <header>

    <p class="sub">Dis-moi une idée, je la pose au bon endroit.</p>
    <div class="topbar"><button class="tbtn" id="menubtn" title="Menu" aria-label="Menu">☰</button><div class="tmenu" id="tmenu"><select class="tbtn" id="bsel" title="Changer de tableau"></select><button class="tbtn" id="bnew">+ Nouveau tableau</button><button class="tbtn" id="bdel" title="Supprimer ce tableau (récupérable dans la corbeille)" style="display:none">Supprimer ce tableau</button><button class="tbtn" id="peoplebtn">👥 Collaborateurs</button><button class="tbtn" id="trashbtn">🗑 Corbeille</button></div></div><span id="zctl0"></span>

  </header>
  <div id="scroller"><div id="board"></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var COLORS={
  blue:['#bcd6f5','#eaf2fc','IRM'],
  purple:['#d9cdf3','#f3effb','Ophtalmo'],
  green:['#cdeccb','#eef8ed','Données'],
  peach:['#fbd9bf','#fef3ea','Clinique'],
  pink:['#f8cfe0','#fdeef4','Pédago']
};
var KEYS=Object.keys(COLORS);
var DEFAULT_FRAMES=[{id:'c1',t:'Idées'},{id:'c2',t:'À explorer'},{id:'c3',t:'En cours'}];
var RET=Infinity, boards=new Map(), cur='main', bcol=null, trash=new Map(), mtrash=new Map();
function bdoc(b){var d=boards.get(b);if(d&&d.frames&&d.frames.length)return d;if(b==='main')return {name:(d&&d.name)||'Mon tableau',frames:DEFAULT_FRAMES};return d||{name:'Tableau',frames:[{id:'c1',t:'Cadre 1'}]}}
function frames(){return bdoc(cur).frames}
function inBoard(n){return (n.board||'main')===cur}
function scopeFrame(f){return cur==='main'?'frame:'+f:'frame:'+cur+':'+f}
function rid(){return Math.random().toString(36).slice(2,10)}
var meetings=new Map(), mcol=null, panes=[];
var notes=new Map(), col=null, active='blue', levels=[], chains=new Map(), chips=[];
var app=$('#app');

function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on')},2800)}
function status(m){$('#status').textContent=m||''}
function col_(k){return COLORS[k]||COLORS.blue}

/* ---------- légende / couleur active ---------- */
function mkLegend(label){
  var box=document.createElement('div');box.className='legend';
  var h=document.createElement('span');h.className='hint';h.textContent=label;box.appendChild(h);
  KEYS.forEach(function(k){
    var b=document.createElement('button');b.className='chip';b.textContent=COLORS[k][2];b.style.background=COLORS[k][0];b.dataset.k=k;
    b.onclick=function(){active=k;refreshChips()};
    box.appendChild(b);chips.push(b);
  });
  return box;
}
function refreshChips(){chips=chips.filter(function(b){return b.isConnected});chips.forEach(function(b){b.classList.toggle('on',b.dataset.k===active)})}
$('#legend').replaceWith(Object.assign(mkLegend('Thème des nouvelles notes :'),{id:'legend'}));
refreshChips();

/* ---------- données ---------- */
function strip(n){var o={};for(var k in n)if(k!=='id')o[k]=n[k];return o}
function save(id,patch){
  var n=notes.get(id);if(n)Object.assign(n,patch);rerender();
  if(!col)return;
  var p=(chains.get(id)||Promise.resolve()).then(function(){return col.doc(id).update(patch)}).catch(function(e){toast('Enregistrement impossible'+(e&&e.code?' ('+e.code+')':''))});
  chains.set(id,p);
}
function chainWrite(c,key,id,patch){
  if(!c)return;
  var p=(chains.get(key)||Promise.resolve()).then(function(){return c.doc(id).update(patch)}).catch(function(){toast('Enregistrement impossible')});
  chains.set(key,p);
}
function hardDelete(id){
  notes.delete(id);if(col)col.doc(id).delete().catch(function(){});rerender();
}
function remove(id){
  var ids=[id],ts=Date.now();
  for(var i=0;i<ids.length;i++)notes.forEach(function(n){if(n.parent===ids[i])ids.push(n.id)});
  ids.forEach(function(i){var n=notes.get(i);if(!n)return;n.del=ts;n.grp=id;trash.set(i,n);notes.delete(i);chainWrite(col,i,i,{del:ts,grp:id})});
  meetings.forEach(function(m,mid){if(ids.indexOf(m.scope)>=0){m.del=ts;m.grp=id;mtrash.set(mid,m);meetings.delete(mid);chainWrite(mcol,'m'+mid,mid,{del:ts,grp:id})}});
  rerender();renderAllMeet();updateTrash();
}
function restoreBoard(id){var d=boards.get(id);if(!d)return;var o={name:d.name,frames:d.frames,ts:d.ts||Date.now()};boards.set(id,o);if(bcol)bcol.doc(id).set(o).catch(function(){});refreshSel();updateTrash()}
function purgeBoard(id){
  var ids={};notes.forEach(function(n,i){if(n.board===id&&!n.parent)ids[i]=1});trash.forEach(function(n,i){if(n.board===id&&!n.parent)ids[i]=1});
  var ch=true;while(ch){ch=false;[notes,trash].forEach(function(M){M.forEach(function(n,i){if(n.parent&&ids[n.parent]&&!ids[i]){ids[i]=1;ch=true}})})}
  Object.keys(ids).forEach(function(i){notes.delete(i);trash.delete(i);if(col)col.doc(i).delete().catch(function(){})});
  [meetings,mtrash].forEach(function(M){M.forEach(function(m,mi){if(ids[m.scope]||String(m.scope).indexOf('frame:'+id+':')===0){M.delete(mi);if(mcol)mcol.doc(mi).delete().catch(function(){})}})});
  boards.delete(id);if(bcol)bcol.doc(id).delete().catch(function(){});refreshSel();updateTrash();
}
function restoreGroup(grp,seen){
  if(String(grp).indexOf('board:')===0){restoreBoard(grp.slice(6));return}
  seen=seen||{};if(seen[grp])return;seen[grp]=1;
  var parents=[];
  trash.forEach(function(n,i){if(n.grp===grp){n.del=0;n.grp=null;notes.set(i,n);trash.delete(i);chainWrite(col,i,i,{del:0,grp:null});if(n.parent&&trash.has(n.parent))parents.push(trash.get(n.parent).grp)}});
  mtrash.forEach(function(m,i){if(m.grp===grp){m.del=0;m.grp=null;meetings.set(i,m);mtrash.delete(i);chainWrite(mcol,'m'+i,i,{del:0,grp:null})}});
  parents.forEach(function(g){restoreGroup(g,seen)});
  rerender();renderAllMeet();updateTrash();
}
function purgeGroup(grp){
  if(String(grp).indexOf('board:')===0){purgeBoard(grp.slice(6));return}
  trash.forEach(function(n,i){if(n.grp===grp){trash.delete(i);if(col)col.doc(i).delete().catch(function(){})}});
  mtrash.forEach(function(m,i){if(m.grp===grp){mtrash.delete(i);if(mcol)mcol.doc(i).delete().catch(function(){})}});
  updateTrash();
}
function create(data,L){
  homeView(L);
  var ref=col?col.doc():null;
  var id=ref?ref.id:'l'+Math.random().toString(36).slice(2,9);
  var n=Object.assign({id:id,text:'',color:active,parent:null,frame:null,x:24,y:24,ts:Date.now()},data);
  if(!n.parent)n.board=cur;
  notes.set(id,n);rerender();
  if(ref)ref.set(strip(n)).catch(function(){toast('Enregistrement impossible')});
  var el=L.els.get(id);if(el)startEdit(el,id);
}
function slotTop(frame){
  var i=frames().findIndex(function(f){return f.id===frame});if(i<0)i=0;
  var x0=i*388+24;
  for(var r=0;r<14;r++)for(var c=0;c<2;c++){
    var x=x0+c*166,y=56+r*166;
    var taken=false;notes.forEach(function(n){if(!n.parent&&inBoard(n)&&Math.abs(n.x-x)<60&&Math.abs(n.y-y)<60)taken=true});
    if(!taken)return{x:x,y:y};
  }
  return{x:x0,y:56};
}
function slotSub(pid){
  for(var r=0;r<20;r++)for(var c=0;c<5;c++){
    var x=24+c*166,y=24+r*166,taken=false;
    notes.forEach(function(n){if(n.parent===pid&&Math.abs(n.x-x)<60&&Math.abs(n.y-y)<60)taken=true});
    if(!taken)return{x:x,y:y};
  }
  return{x:24,y:24};
}

/* ---------- notes (post-its) ---------- */
function buildNote(L,id){
  var el=document.createElement('div');el.className='postit';el.dataset.id=id;el._L=L;
  el.innerHTML='<div class="tools"><button class="b-ed" title="Modifier">✎</button><button class="b-col" title="Changer de thème">◐</button><button class="b-who" title="Collaborateurs concernés">👤</button><button class="b-size" title="Changer la taille">⤢</button><button class="b-arch" title="Archiver">✓</button><button class="b-del" title="Supprimer">×</button></div><div class="txt"></div><div class="badge"></div><div class="rz" title="Étirer"></div>';
  var t=$('.txt',el);
  $('.b-ed',el).onclick=function(e){e.stopPropagation();startEdit(el,id)};
  $('.b-col',el).onclick=function(e){e.stopPropagation();var n=notes.get(id);if(!n)return;var i=KEYS.indexOf(n.color);save(id,{color:KEYS[(i+1)%KEYS.length]})};
  $('.b-arch',el).onclick=function(e){e.stopPropagation();var n=notes.get(id);if(!n)return;save(id,{arch:n.arch?0:Date.now()})};
  $('.b-size',el).onclick=function(e){e.stopPropagation();var n=notes.get(id);if(!n)return;var S=[160,240,360,520],i=S.indexOf(n.w||240);save(id,{w:S[(i+1)%S.length]})};
  $('.b-who',el).onclick=function(e){e.stopPropagation();whoPop(id,e.currentTarget)};
  var del=$('.b-del',el);
  del.onclick=function(e){
    e.stopPropagation();
    if(del.classList.contains('arm')){remove(id);return}
    del.classList.add('arm');del.textContent='Supprimer ?';
    setTimeout(function(){del.classList.remove('arm');del.textContent='×'},2200);
  };
  ['pointerdown','click','dblclick'].forEach(function(ev){$('.tools',el).addEventListener(ev,function(e){e.stopPropagation()})});
  t.addEventListener('keydown',function(e){
    if(!el.classList.contains('editing'))return;
    e.stopPropagation();
    if((e.key==='Enter'&&!e.shiftKey)||e.key==='Escape'){e.preventDefault();t.blur()}
  });
  t.addEventListener('paste',function(e){
    e.preventDefault();var s=(e.clipboardData||window.clipboardData).getData('text');document.execCommand('insertText',false,s);
  });
  el.addEventListener('pointerdown',function(e){
    if(el.classList.contains('editing')||e.button>0)return;
    if(e.target.closest('.tools'))return;
    var n=notes.get(id);if(!n)return;
    if(e.target.closest('.rz')){
      e.stopPropagation();e.preventDefault();
      var rx=e.clientX,ry=e.clientY,w0=n.w||(n.img?240:150),h0=n.h||(n.leaf?el.getBoundingClientRect().height*w0/(el.getBoundingClientRect().width||w0):150),rw=w0,rh=h0;
      var rect0=el.getBoundingClientRect(),ratio0=rect0.width?w0/rect0.width:1;
      try{el.setPointerCapture(e.pointerId)}catch(_){}
      el.classList.add('rsz');
      var rmv=function(ev){
        rw=Math.max(n.img?100:90,Math.round(w0+(ev.clientX-rx)*ratio0));
        rh=Math.max(70,Math.round(h0+(ev.clientY-ry)*ratio0));
        if(n.img){el.style.setProperty('--w',rw+'px')}
        else{el.style.width=rw+'px';if(n.leaf)el.style.minHeight=rh+'px';else el.style.height=rh+'px'}
        sizeFont(el,n,rw,rh);
      };
      var rup=function(){
        el.removeEventListener('pointermove',rmv);el.removeEventListener('pointerup',rup);el.removeEventListener('pointercancel',rup);
        el.classList.remove('rsz');
        save(id,n.img?{w:rw}:{w:rw,h:rh});
      };
      el.addEventListener('pointermove',rmv);el.addEventListener('pointerup',rup);el.addEventListener('pointercancel',rup);
      return;
    }
    var sx=e.clientX,sy=e.clientY,ox=n.x,oy=n.y,moved=false;
    try{el.setPointerCapture(e.pointerId)}catch(_){}
    function mv(ev){
      var sc=L.scale||1,dx=(ev.clientX-sx)/sc,dy=(ev.clientY-sy)/sc;
      if(!moved&&Math.hypot(dx*sc,dy*sc)>5){moved=true;el._drag=true;el.classList.add('drag')}
      if(moved){var nx=ox+dx+(L.ox||0),ny=oy+dy+(L.oy||0);if(!L.pan){nx=Math.max(0,nx);ny=Math.max(0,ny)}el.style.left=nx+'px';el.style.top=ny+'px'}
    }
    function up(){
      el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);
      el.classList.remove('drag');
      if(moved){
        var x=Math.round(parseFloat(el.style.left)-(L.ox||0)),y=Math.round(parseFloat(el.style.top)-(L.oy||0));
        el._drag=false;save(id,{x:x,y:y});
      }else{var nn=notes.get(id);if(nn&&nn.img)openLightbox(nn);else if(nn&&nn.leaf)startEdit(el,id);else openNote(id,el)}
    }
    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  });
  return el;
}

/* ---------- images ---------- */
function fileToImg(file){
  return new Promise(function(ok,ko){
    var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var W=im.naturalWidth,H=im.naturalHeight,out=null;
      [[1400,.85],[1000,.72],[700,.6]].some(function(p){
        var k=Math.min(1,p[0]/Math.max(W,H)),c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(W*k));c.height=Math.max(1,Math.round(H*k));
        var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
        out={url:c.toDataURL('image/jpeg',p[1]),ar:c.height/c.width};
        return out.url.length<2500000;
      });
      URL.revokeObjectURL(u);ok(out);
    };
    im.onerror=function(){URL.revokeObjectURL(u);ko(new Error('image illisible'))};
    im.src=u;
  });
}
var imgJitter=0;
function addImages(files,L,pos){
  if(!pos)homeView(L);
  var list=Array.prototype.filter.call(files||[],function(f){return /^image\//.test(f.type)});
  if(!list.length){toast('Aucune image reconnue');return}
  list.forEach(function(f,i){
    fileToImg(f).then(function(r){
      var ref=col?col.doc():null,id=ref?ref.id:'l'+Math.random().toString(36).slice(2,9);
      var p;
      if(pos)p={x:Math.round(pos.x-(L.ox||0)-120+i*28),y:Math.round(pos.y-(L.oy||0)-60+i*28)};
      else{p=slotSub(L.parentId);imgJitter=(imgJitter+1)%7;p={x:p.x+(imgJitter*13%40)-10,y:p.y+(imgJitter*29%40)-10}}
      var n={id:id,text:'',color:active,parent:L.parentId,frame:null,x:p.x,y:p.y,ts:Date.now(),img:r.url,ar:Math.round(r.ar*1000)/1000,w:240};
      notes.set(id,n);rerender();
      if(ref)ref.set(strip(n)).catch(function(){toast('Enregistrement impossible')});
    }).catch(function(){toast('Image non ajoutée')});
  });
}
document.addEventListener('paste',function(e){
  var L=levels[levels.length-1];if(!L||L.kind!=='note')return;
  var cd=e.clipboardData;if(!cd||!cd.files||!cd.files.length)return;
  if(!Array.prototype.some.call(cd.files,function(f){return /^image\//.test(f.type)}))return;
  e.preventDefault();addImages(cd.files,L,null);
});
function noteBox(L,n){
  var w=n.img?(n.w||240):(n.w||150),h;
  if(n.img)h=w*(n.ar||.75);
  else if(n.h)h=n.h;
  else if(n.leaf){var el=L.els.get(n.id),r=el&&el.getBoundingClientRect();h=r&&r.width?r.height*w/r.width:110}
  else h=150;
  return{w:w,h:h};
}
function arrange(L){
  var list=[];notes.forEach(function(n){if((n.parent||null)===L.parentId&&!n.del)list.push(n)});
  if(!list.length)return;
  list.sort(function(a,b){return (Math.round(a.y/80)-Math.round(b.y/80))||(a.x-b.x)});
  L.ox=0;L.oy=0;var W=830,G=18,x=24,y=24,rowH=0;
  list.forEach(function(n){
    var b=noteBox(L,n);
    if(x>24&&x+b.w>W){x=24;y+=rowH+G;rowH=0}
    save(n.id,{x:Math.round(x),y:Math.round(y),rot:0});
    x+=b.w+G;rowH=Math.max(rowH,b.h);
  });
}
function openLightbox(n){
  var d=document.createElement('div');d.className='lightbox';
  var im=document.createElement('img');im.src=n.img;d.appendChild(im);
  function close(){d.remove();document.removeEventListener('keydown',kd,true)}
  function kd(e){if(e.key==='Escape'){e.stopPropagation();close()}}
  d.onclick=close;document.addEventListener('keydown',kd,true);
  document.body.appendChild(d);
}
function startEdit(el,id){
  var t=$('.txt',el);
  el.classList.add('editing');t.contentEditable='true';t.focus();
  var r=document.createRange();r.selectNodeContents(t);var s=getSelection();s.removeAllRanges();s.addRange(r);
  function done(){
    t.removeEventListener('blur',done);t.contentEditable='false';el.classList.remove('editing');
    var v=t.innerText.replace(/ /g,' ').trim(),n=notes.get(id);if(!n)return;
    if(!v){if(!n.text)hardDelete(id);else t.textContent=n.text;return}
    if(v!==n.text)save(id,{text:v});
  }
  t.addEventListener('blur',done);
}
function hash(id){var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;return h}
function updateNote(el,n){
  var c=col_(n.color);
  el.style.backgroundColor=c[0];el.style.setProperty('--rot',(n.rot!=null?n.rot:(((hash(n.id)%50)-25)/10))+'deg');
  if(n.img){el.classList.add('imgnote');el.style.setProperty('--w',(n.w||240)+'px');var im=$('img',el);if(!im){im=document.createElement('img');im.draggable=false;el.insertBefore(im,$('.txt',el))}if(im.getAttribute('src')!==n.img)im.src=n.img}
  var LL=el._L||{};if(!el._drag){el.style.left=(n.x+(LL.ox||0))+'px';el.style.top=(n.y+(LL.oy||0))+'px'}
  if(!el.classList.contains('editing')){var t=$('.txt',el);if(t.textContent!==n.text)t.textContent=n.text}
  el.classList.toggle('arch',!!n.arch);el.classList.toggle('leaf',!!n.leaf);var ba=$('.b-arch',el);if(ba)ba.title=n.arch?'Désarchiver':'Archiver';
  var wl=(n.who||[]).map(function(pid){var d=boards.get(pid);return d&&d.pers&&!d.del?{n:d.name||'?',i:ini(d.name||'?')}:null}).filter(Boolean),wh=$('.whos',el);
  if(wl.length){if(!wh){wh=document.createElement('div');wh.className='whos';el.appendChild(wh)}var wt=wl.slice(0,6).map(function(x){return '<i>'+x.i.replace(/[<>&"]/g,'')+'</i>'}).join('')+(wl.length>6?'<i>+'+(wl.length-6)+'</i>':'');if(wh.innerHTML!==wt)wh.innerHTML=wt}else if(wh)wh.remove();
  var k=0;notes.forEach(function(m){if(m.parent===n.id)k++});
  $('.badge',el).textContent=n.leaf?'':(k?('↘ '+k):'↘');
  if(!el.classList.contains('rsz')){
    if(!n.img){var w=n.w||150;el.style.width=w+'px';if(n.leaf){el.style.height='';el.style.minHeight=(n.h||84)+'px'}else el.style.height=(n.h||150)+'px'}
    sizeFont(el,n,n.w||150,n.h||150);

      notes.forEach(function(n){if(!n.parent&&inBoard(n)&&Math.floor((n.x+75)/388)===i)nn++});
      meetings.forEach(function(m){if(m.scope===sc)nm++});
      if(nn||nm){toast('Ce cadre contient '+(nn?nn+' post-it(s)':'')+(nn&&nm?' et ':'')+(nm?nm+' réunion(s)':'')+' : supprime-les d\u2019abord (ils iront à la corbeille).');return}
      if(!fdb.classList.contains('arm')){fdb.classList.add('arm');fdb.textContent='Supprimer ?';setTimeout(function(){fdb.classList.remove('arm');fdb.textContent='×'},2200);return}
      deleteFrame(i);
    };
    board.appendChild(d);
  });
  var af=document.createElement('div');af.className='addframe';af.style.left=(fr.length*388)+'px';af.textContent='+ Cadre';
  af.onclick=function(){
    var d=bdoc(cur),nf=d.frames.concat([{id:'c'+rid(),t:'Nouveau cadre'}]);
    boards.set(cur,{name:d.name,frames:nf,ts:d.ts||Date.now()});saveBoard(cur);buildBoard();
  };
  board.appendChild(af);
  board.style.width=((fr.length+1)*388)+'px';
  renderLevel(L0);
  $('#bname').textContent=bdoc(cur).name;
  refreshSel();
}
function refreshSel(){

  boards.forEach(function(d,id){if(id!=='main'&&!d.del&&!d.pers)list.push({id:id,name:d.name,ts:d.ts||0})});

  list.forEach(function(b){var o=document.createElement('option');o.value=b.id;o.textContent=b.name;sel.appendChild(o)});

/* ---------- corbeille ---------- */
function trashRoots(){
  var out=[];
  trash.forEach(function(n,i){if(n.grp===i||!n.grp)out.push({kind:'Post-it',id:n.grp||i,text:n.text||(n.img?'🖼 (image)':'(vide)'),del:n.del})});
  mtrash.forEach(function(m,i){if(m.grp===i)out.push({kind:'Réunion du '+(m.date||'?'),id:i,text:m.text||'(vide)',del:m.del})});
  boards.forEach(function(d,id){if(d.del)out.push({kind:'Tableau',id:'board:'+id,text:'« '+d.name+' » ('+(d.frames||[]).length+' cadre(s))',del:d.del})});
  out.sort(function(a,b){return b.del-a.del});
  return out;
}
function updateTrash(){
  var n=trashRoots().length;$('#trashbtn').textContent='🗑 Corbeille'+(n?' · '+n:'');
  if($('.trashp'))renderTrash();
}
function renderTrash(){
  var p=$('.trashp');if(!p)return;var l=$('.tl',p);l.textContent='';
  var roots=trashRoots();
  if(!roots.length){var e=document.createElement('div');e.className='mempty';e.textContent='La corbeille est vide.';l.appendChild(e)}
  roots.forEach(function(r){
    var row=document.createElement('div');row.className='trow';
    var tt=document.createElement('div');tt.className='tt';
    tt.textContent=r.text.length>140?r.text.slice(0,140)+'…':r.text;
    var sm=document.createElement('small');sm.textContent=r.kind+' · supprimé le '+new Date(r.del).toLocaleDateString('fr-FR')+'';tt.appendChild(sm);
    var rs=document.createElement('button');rs.className='rs';rs.textContent='Restaurer';rs.onclick=function(){restoreGroup(r.id)};
    var dl=document.createElement('button');dl.className='dl';dl.textContent='Supprimer pour de bon';
    dl.onclick=function(){
      if(dl.classList.contains('arm')){purgeGroup(r.id);return}
      dl.classList.add('arm');dl.textContent='Sûr ?';setTimeout(function(){dl.classList.remove('arm');dl.textContent='Supprimer pour de bon'},2200);
    };
    row.appendChild(tt);row.appendChild(rs);row.appendChild(dl);l.appendChild(row);
  });
}
$('#trashbtn').onclick=function(){
  if($('.trashp')){$('.trashp').remove();return}

  p.innerHTML='<div class="th"><button class="back">← Retour</button><h2>Corbeille</h2></div><div class="mempty" style="margin:0 32px">Les post-its, réunions et tableaux supprimés sont conservés sans limite de durée, jusqu\'à ce que tu choisisses de les supprimer pour de bon.</div><div class="tl"></div>';
  $('.back',p).onclick=function(){p.remove()};
  app.appendChild(p);renderTrash();
};

/* ---------- collaborateurs (pense-bête) ---------- */
function ini(name){var w=String(name).trim().split(/[\s-]+/).filter(Boolean);if(!w.length)return '?';if(w.length===1)return w[0].charAt(0).toUpperCase()+w[0].charAt(1).toLowerCase();return (w[0].charAt(0)+w[w.length-1].charAt(0)).toUpperCase()}
function persons(){var a=[];boards.forEach(function(d,id){if(d.pers&&!d.del)a.push({id:id,name:d.name||'?',asks:(d.asks||[]).slice(),ts:d.ts||0})});a.sort(function(x,y){return x.name.localeCompare(y.name,'fr')});return a}
function savePerson(p){
  var o={name:p.name,pers:1,asks:p.asks,ts:p.ts||Date.now()};boards.set(p.id,o);
  if(bcol)bcol.doc(p.id).set(o).catch(function(){toast('Enregistrement impossible')});
  rerender();renderPeople(true);
}
function removePerson(id){boards.delete(id);if(bcol)bcol.doc(id).delete().catch(function(){});
  notes.forEach(function(n){if(n.who&&n.who.indexOf(id)>=0)save(n.id,{who:n.who.filter(function(x){return x!==id})})});
  rerender();renderPeople(true)}
function openAsks(){var k=0;persons().forEach(function(p){p.asks.forEach(function(a){if(!a.done)k++})});return k}
function updatePeopleBtn(){var k=openAsks();$('#peoplebtn').textContent='👥 Collaborateurs'+(k?' · '+k:'')}
var peopleSig='';
function renderPeople(force){
  updatePeopleBtn();
  var P=$('.peoplep');if(!P)return;
  var ps=persons(),tagged={};
  notes.forEach(function(n){(n.who||[]).forEach(function(pid){(tagged[pid]=tagged[pid]||[]).push(n)})});
  var sig=JSON.stringify(ps)+JSON.stringify(Object.keys(tagged).map(function(k){return[k,tagged[k].map(function(n){return n.id+n.text})]}));
  if(!force&&sig===peopleSig)return;peopleSig=sig;
  var g=$('.pgrid',P),keep=document.activeElement&&P.contains(document.activeElement)?document.activeElement:null,keepKey=keep&&keep.dataset?keep.dataset.k:null,keepVal=keep&&keep.value;
  g.textContent='';
  if(!ps.length){var e=document.createElement('div');e.className='mempty';e.textContent='Aucun collaborateur pour l’instant. Ajoute un prénom ci-dessus.';g.appendChild(e)}
  ps.forEach(function(p){
    var c=document.createElement('div');c.className='pcard';
    var h=document.createElement('h3');h.textContent=p.name;h.contentEditable='true';h.dataset.k='n'+p.id;
    h.onkeydown=function(e){if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();h.blur()}};
    h.onblur=function(){var v=h.textContent.trim();if(!v){h.textContent=p.name;return}if(v!==p.name){p.name=v;savePerson(p)}};
    var sm=document.createElement('small'),op=p.asks.filter(function(a){return !a.done}).length;sm.textContent=op?(op+' à demander'):'Rien à demander';
    c.appendChild(h);c.appendChild(sm);
    p.asks.forEach(function(a,i){
      var r=document.createElement('div');r.className='pask'+(a.done?' done':'');
      var cb=document.createElement('input');cb.type='checkbox';cb.checked=!!a.done;cb.onchange=function(){a.done=cb.checked?Date.now():0;savePerson(p)};
      var t=document.createElement('span');t.textContent=a.t;
      var x=document.createElement('button');x.textContent='×';x.title='Retirer';x.onclick=function(){p.asks.splice(i,1);savePerson(p)};
      r.appendChild(cb);r.appendChild(t);r.appendChild(x);c.appendChild(r);
    });
    var inp=document.createElement('input');inp.type='text';inp.className='pnew';inp.placeholder='+ À demander à '+p.name.split(' ')[0]+'…';inp.dataset.k='a'+p.id;
    inp.onkeydown=function(e){if(e.key==='Enter'){var v=inp.value.trim();if(!v)return;p.asks.push({id:Math.random().toString(36).slice(2,9),t:v,done:0,ts:Date.now()});keepKey='a'+p.id;keepVal='';savePerson(p)}};
    c.appendChild(inp);
    var tg=tagged[p.id];
    if(tg&&tg.length){var pl=document.createElement('div');pl.className='plinks';pl.appendChild(document.createTextNode('Post-its liés :'));
      tg.slice(0,8).forEach(function(n){var d=document.createElement('div');d.textContent=n.text?(n.text.length>70?n.text.slice(0,70)+'…':n.text):(n.img?'(image)':'(vide)');pl.appendChild(d)});c.appendChild(pl)}
    var dl=document.createElement('button');dl.className='pdel';dl.textContent='Supprimer ce collaborateur';
    dl.onclick=function(){if(dl.classList.contains('arm')){removePerson(p.id);return}dl.classList.add('arm');dl.textContent='Sûr ?';setTimeout(function(){dl.classList.remove('arm');dl.textContent='Supprimer ce collaborateur'},2200)};
    c.appendChild(dl);g.appendChild(c);
  });
  if(keepKey){var q=g.querySelector('[data-k="'+keepKey+'"]');if(q){q.focus();if(keepVal!=null&&'value' in q)q.value=keepVal}}
}
$('#peoplebtn').onclick=function(){
  if($('.peoplep')){$('.peoplep').remove();return}
  var p=document.createElement('div');p.className='peoplep';
  p.innerHTML='<div class="th"><button class="back">← Retour</button><h2>Collaborateurs</h2></div><div class="mempty" style="margin:0 32px">Pense-bête : note ce que tu dois demander à chacun. Dans un post-it, le bouton 👤 permet d’indiquer les collaborateurs concernés.</div><div class="pl"><div class="padd"><input type="text" placeholder="Prénom ou nom du collaborateur…"><button class="addbtn">+ Ajouter</button></div><div class="pgrid"></div></div>';
  $('.back',p).onclick=function(){p.remove()};
  var inp=$('input',p);

  inp.onkeydown=function(e){if(e.key==='Enter')add()};$('.addbtn',p).onclick=add;
  app.appendChild(p);peopleSig='';renderPeople(true);inp.focus();

function whoPop(id,btn){
  $$('.whop').forEach(function(x){x.remove()});
  var n=notes.get(id);if(!n)return;
  var d=document.createElement('div');d.className='whop';
  var ps=persons();
  if(!ps.length){d.innerHTML='<small>Aucun collaborateur : ajoutes-en via « 👥 Collaborateurs » en haut.</small>'}
  ps.forEach(function(p){
    var l=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.checked=(n.who||[]).indexOf(p.id)>=0;
    cb.onchange=function(){var w=(notes.get(id).who||[]).filter(function(x){return x!==p.id});if(cb.checked)w.push(p.id);save(id,{who:w})};

  var r=btn.getBoundingClientRect();d.style.left=Math.max(8,Math.min(innerWidth-200,r.left))+'px';d.style.top=Math.min(innerHeight-60,r.bottom+6)+'px';

async function localDb(){
  try{
    var r,j;
    for(var tr=0;tr<10;tr++){
      r=await fetch('/api/data');
      if(r.ok){j=await r.json();break}
      if(r.status!==503)return null;
      await new Promise(function(ok){setTimeout(ok,1500)});
    }
    if(!j||!j.data)return null;
    var S=j.data,ver=j.v,subs={};
    function snapOf(name){
      var c=S[name]||{};
      return {docs:Object.keys(c).map(function(id){var d=c[id];return {id:id,exists:true,data:function(){return Object.freeze(Object.assign({},d))},metadata:{}}}),metadata:{fromCache:false}};
    }
    function emit(name){(subs[name]||[]).forEach(function(f){f(snapOf(name))})}
    function post(op){
      return fetch('/api/op',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(op)}).then(function(r){if(!r.ok)throw new Error('http '+r.status)});
    }
    setInterval(function(){
      fetch('/api/data?v='+ver).then(function(r){return r.json()}).then(function(j){
        if(j.same||!j.data)return;ver=j.v;S=j.data;emit('postits');emit('meetings');emit('boards');
      }).catch(function(){});
    },2000);
    return {collection:function(name){
      S[name]=S[name]||{};
      return {
        onSnapshot:function(f){(subs[name]=subs[name]||[]).push(f);setTimeout(function(){f(snapOf(name))},0);return function(){}},
        doc:function(id){
          id=id||Math.random().toString(36).slice(2,12)+Date.now().toString(36);
          return {id:id,
            set:function(d){S[name][id]=d;emit(name);return post({op:'set',col:name,id:id,data:d})},
            update:function(d){if(!S[name][id])return Promise.reject(new Error('absent'));S[name][id]=Object.assign({},S[name][id],d);emit(name);return post({op:'update',col:name,id:id,data:d})},
            delete:function(){delete S[name][id];emit(name);return post({op:'delete',col:name,id:id})}
          };
        }
      };
    }};
  }catch(e){return null}
}

/* ---------- connexion à la base ---------- */
(async function(){
  try{
    var db=null;
    if(window.claude&&claude.use)db=await claude.use('db');
    if(!db)db=await localDb();
    if(!db){status('Base de données indisponible : les notes ne seront pas enregistrées.');return}
    col=db.collection('postits');
    status('Chargement…');
    var timer=setTimeout(function(){status('Données pas encore joignables…')},10000);
    col.onSnapshot(function(snap){
      clearTimeout(timer);if(!snap.metadata.fromCache)status('');
      notes.clear();trash.clear();var now=Date.now();
      snap.docs.forEach(function(d){
        var o=Object.assign({},d.data()||{});o.id=d.id;
        if(o.del){if(now-o.del>RET)col.doc(d.id).delete().catch(function(){});else trash.set(d.id,o)}else notes.set(d.id,o);
      });
      rerender();updateTrash();
    },function(){clearTimeout(timer);status('Lecture impossible pour le moment.')});
    mcol=db.collection('meetings');
    mcol.onSnapshot(function(snap){
      meetings.clear();mtrash.clear();var now=Date.now();
      snap.docs.forEach(function(d){
        var o=Object.assign({},d.data()||{});o.id=d.id;
        if(o.del){if(now-o.del>RET)mcol.doc(d.id).delete().catch(function(){});else mtrash.set(d.id,o)}else meetings.set(d.id,o);
      });
      renderAllMeet();updateTrash();
    },function(){});
    bcol=db.collection('boards');
    bcol.onSnapshot(function(snap){
      var before=JSON.stringify(bdoc(cur))+cur;
      boards.clear();snap.docs.forEach(function(d){boards.set(d.id,Object.assign({},d.data()||{}))});
      if(cur!=='main'&&(!boards.has(cur)||boards.get(cur).del))cur='main';
      updateTrash();
      if(JSON.stringify(bdoc(cur))+cur!==before)buildBoard();else refreshSel();
      try{rerender();renderPeople()}catch(e){}
    },function(){});
  }catch(e){status('Base de données indisponible.')}
})();
})();
